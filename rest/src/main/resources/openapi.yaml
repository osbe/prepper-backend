openapi: 3.0.3
info:
  title: Prepper Backend API
  version: 0.10.0
servers:
  - url: http://localhost:8080
    description: >
      Local development (`./mvnw quarkus:dev`), and the address a
      `kubectl port-forward -n prepper svc/prepper-backend 8080:8080` exposes.
  - url: "{scheme}://{host}"
    description: >
      A deployed instance. The Helm chart creates a ClusterIP Service only, so the host
      is whatever Ingress, LoadBalancer or port-forward fronts it in your cluster —
      substitute it here.
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
      host:
        default: prepper-backend.example.com
security:
  - basicAuth: []

paths:
  /me:
    get:
      summary: Get the currently authenticated user and their roles
      description: >
        Validates the HTTP Basic credentials on the request and reports the roles they
        carry. This is the credential-check call for clients: `200` means the credentials
        are valid, `401` means they are not. Gate write actions on `canWrite` (or on
        `admin` appearing in `roles`) rather than on the username.
      operationId: getCurrentUser
      tags:
        - Auth
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        "401":
          $ref: '#/components/responses/Unauthorized'
  /products:
    get:
      summary: List all products
      operationId: listProducts
      tags:
        - Products
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
      responses:
        "200":
          description: List of products with current stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a product
      operationId: createProduct
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        "200":
          description: Created product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /products/{id}:
    get:
      summary: Get a product with current stock
      operationId: getProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Update a product
      operationId: updateProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Delete a product and all its stock entries
      operationId: deleteProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "204":
          description: Deleted
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /products/{id}/stock:
    get:
      summary: List stock entries for a product, ordered by expiry date (oldest first)
      operationId: listProductStock
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Stock entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockEntry'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Add a stock entry for a product
      operationId: createStockEntry
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEntryRequest'
      responses:
        "200":
          description: Created stock entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEntry'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /stock/expired:
    get:
      summary: Get stock entries that have already expired, oldest expiry first
      operationId: getExpiredStock
      tags:
        - Stock
      responses:
        "200":
          description: Expired stock entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockEntry'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /stock/expiring:
    get:
      summary: Get stock entries expiring within N days, oldest expiry first
      operationId: getExpiringStock
      tags:
        - Stock
      parameters:
        - name: days
          in: query
          description: Window size in days, counted from today inclusive.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 30
      responses:
        "200":
          description: Expiring stock entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockEntry'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /stock/low:
    get:
      summary: Get products where current stock is below a quarter of target quantity, emptiest first
      description: >
        Sorted by fill ratio (current stock / target quantity), emptiest first. A product
        with a target quantity of 0 is never reported as low, even with no stock at all.
      operationId: getLowStock
      tags:
        - Stock
      responses:
        "200":
          description: Products with low stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /stock/{id}:
    put:
      summary: Update all fields of a stock entry
      operationId: replaceStockEntry
      tags:
        - Stock
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEntryRequest'
      responses:
        "200":
          description: Updated stock entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEntry'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: Update remaining quantity of a stock entry
      operationId: updateStockEntry
      tags:
        - Stock
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEntryPatch'
      responses:
        "200":
          description: Updated stock entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEntry'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Delete a stock entry (fully consumed)
      operationId: deleteStockEntry
      tags:
        - Stock
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "204":
          description: Deleted
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        HTTP Basic Auth against users stored in the database. Role `user` may call the
        read-only GET endpoints; role `admin` may call everything, including all writes.
  responses:
    BadRequest:
      description: >
        The request body is invalid. Two different shapes come back, distinguished by
        `Content-Type`. A field that violates the constraints declared in this spec —
        missing when required, out of range, too long — yields `application/json`
        conforming to ConstraintViolationProblem. A value that cannot be parsed at all,
        such as an unknown category or unit, yields a bare `text/plain` message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConstraintViolationProblem'
        text/plain:
          schema:
            type: string
            example: 'No enum constant se.oskr.model.Category.NOT_A_CATEGORY'
    Unauthorized:
      description: >
        Missing or invalid HTTP Basic credentials. The body is empty; the response
        carries a `WWW-Authenticate: Basic` header.
    Forbidden:
      description: >
        Authenticated, but the user lacks the role this operation requires. Writes
        require the `admin` role. The body is empty.
    NotFound:
      description: >
        No resource exists with the given id. For the nested stock routes this also
        covers a missing parent product. The body is empty.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    CurrentUser:
      type: object
      required:
        - username
        - roles
        - canWrite
      properties:
        username:
          type: string
        roles:
          type: array
          description: >
            Roles held by this user. `user` grants the read-only GET endpoints; `admin`
            additionally grants every write. The seeded admin holds both.
          items:
            type: string
        canWrite:
          type: boolean
          description: >
            True when `roles` contains `admin`, i.e. when this user may call the write
            endpoints. Provided so clients can gate write UI without string matching.
    Violation:
      type: object
      properties:
        field:
          type: string
          description: >
            Path to the offending field, prefixed with the operation and parameter name,
            e.g. `createProduct.productRequest.name`. Strip everything up to the last dot
            to map it onto a form field.
        message:
          type: string
    ConstraintViolationProblem:
      type: object
      description: Body of a 400 caused by a Bean Validation failure.
      properties:
        title:
          type: string
          example: Constraint Violation
        status:
          type: integer
          format: int32
          example: 400
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    ExpiryStatus:
      type: string
      enum:
        - APPROACHING
        - EXPIRED
    Category:
      type: string
      enum:
        - WATER
        - PRESERVED_FOOD
        - DRY_GOODS
        - FREEZE_DRIED
        - MEDICINE
        - FUEL
        - STAPLES
        - OTHER
    Unit:
      type: string
      enum:
        - LITERS
        - KG
        - CANS
        - PIECES
        - GRAMS
    ProductRequest:
      type: object
      required:
        - name
        - category
        - unit
        - targetQuantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        category:
          $ref: '#/components/schemas/Category'
        unit:
          $ref: '#/components/schemas/Unit'
        targetQuantity:
          type: number
          format: double
          minimum: 0
          description: >
            The amount you want on hand. A target of 0 opts the product out of the
            low-stock report entirely.
        notes:
          type: string
          maxLength: 255
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        unit:
          $ref: '#/components/schemas/Unit'
        targetQuantity:
          type: number
          format: double
        currentStock:
          type: number
          format: double
        notes:
          type: string
    StockEntryRequest:
      type: object
      description: >
        The full state of a stock entry. PUT replaces every field, so any optional field
        omitted here is written as null — send the whole entry back, not just what changed.
      required:
        - quantity
        - expiryDate
      properties:
        quantity:
          type: number
          format: double
          minimum: 0
        subType:
          type: string
          maxLength: 255
          description: Variant or sub-type of the product (e.g. "Spaghetti" for a Pasta product)
        purchasedDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        location:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 255
    StockEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: number
          format: double
        subType:
          type: string
          description: Variant or sub-type of the product (e.g. "Spaghetti" for a Pasta product)
        purchasedDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        location:
          type: string
        notes:
          type: string
        expiryStatus:
          $ref: '#/components/schemas/ExpiryStatus'
          description: >
            Expiry status for this stock entry. Populated when the entry is expired or
            expiring within 30 days; null otherwise. Use with the product category as an
            i18n key (e.g. "action.WATER.APPROACHING").
    StockEntryPatch:
      type: object
      description: >
        Partial update of a stock entry. Only the remaining quantity can be changed this
        way; every other field is left untouched.
      required:
        - quantity
      properties:
        quantity:
          type: number
          format: double
          minimum: 0
