fullnameOverride: prepper-backend

replicaCount: 1

image:
  repository: ghcr.io/osbe/prepper-backend
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

db:
  host: prepper-postgres-postgresql
  port: 5432
  name: prepper
  user: CHANGEME
  password: CHANGEME
  createSecret: true
  # Hibernate schema mode: update (default), validate, none, drop-and-create
  schemaGeneration: update

auth:
  adminPassword: CHANGEME
  userPassword: CHANGEME
  createSecret: true

# Browser origins allowed to call the API. Only browser-based clients need this;
# native mobile clients do not enforce CORS. Never leave it empty — Quarkus allows
# every origin when no origins are configured.
cors:
  origins: http://localhost:3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
