# Quarkus application configuration

# Datasource — db-kind tells Dev Services what container to start in dev/test
quarkus.datasource.db-kind=postgresql

# Production datasource (set via env vars or override in prod profile)
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# HTTP Basic Auth
quarkus.http.auth.basic=true

# Seeded user passwords — must be set via APP_ADMIN_PASSWORD / APP_USER_PASSWORD env vars in prod
app.auth.admin-password=${APP_ADMIN_PASSWORD:admin}
app.auth.user-password=${APP_USER_PASSWORD:user}

# CORS
# Only browser-based clients need this — native iOS/Android, React Native and Flutter
# native targets do not enforce CORS. Enabled here for Flutter web, Expo web and
# Capacitor/Ionic clients.
#
# origins must always be set explicitly: if it is left empty Quarkus allows ANY origin.
# The default below covers local dev servers and Capacitor's WebView origins; set
# CORS_ORIGINS to your real origin in prod.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8100,http://localhost:19006,capacitor://localhost,ionic://localhost}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type
quarkus.http.cors.exposed-headers=www-authenticate
quarkus.http.cors.access-control-max-age=24H

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.database.generation=${DB_SCHEMA_GENERATION:update}
